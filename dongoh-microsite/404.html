<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page Not Found — Dongoh Food</title>
  <link rel="icon" href="/images/favicon.png" type="image/png">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #f6f3ec; text-align: center;
      background: radial-gradient(ellipse at top, #0c4a55 0%, #133826 55%, #0d2a1d 100%);
    }
    main { width: 100%; max-width: 480px; }
    .code { font-family: Georgia, "Times New Roman", serif; font-size: clamp(72px, 18vw, 140px); line-height: 1; color: #c8a96a; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: clamp(22px, 4vw, 32px); margin: 18px 0 12px; }
    p { color: #a9d3bd; line-height: 1.6; margin: 0 auto 32px; }
    a {
      display: inline-block; padding: 14px 28px; border-radius: 999px;
      background: #f6f3ec; color: #133826; font-weight: 600; text-decoration: none;
      transition: transform .2s ease;
    }
    a:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>This page has drifted out to sea.</h1>
    <p>The page you are looking for doesn't exist or has been moved.</p>
    <a href="/">Back to Dongoh Food</a>
  </main>
</body>
</html>
